name: Runbay Rust CI (Linux & macOS)

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, backend: bwrap }
          - { os: ubuntu-latest, backend: landlock }
          - { os: macos-latest, backend: auto }
    runs-on: ${{ matrix.os }}
    env:
      RUNBAY_SANDBOX_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux sandbox tooling and scoped user-namespace policies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap curl apparmor-profiles
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = 1 ]; then
            sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          fi
          sudo sh scripts/install-linux-launcher.sh

      - name: Boot the minimum Linux kernel with the native launcher
        if: matrix.backend == 'landlock'
        run: |
          sudo apt-get install -y --no-install-recommends qemu-system-x86 cpio
          deb="$RUNNER_TEMP/kernel-5.13.deb"
          curl --fail --location --retry 3 --output "$deb" \
            https://old-releases.ubuntu.com/ubuntu/pool/main/l/linux-signed/linux-image-5.13.0-19-generic_5.13.0-19.19_amd64.deb
          echo "eca13c306042c2798cf46849a7bc6633354572f549ecafc44c4a572ab5ac2540  $deb" | sha256sum -c -
          dpkg-deb -x "$deb" "$RUNNER_TEMP/linux-5.13"
          KERNEL_CC=cc KERNEL_IMAGE="$RUNNER_TEMP/linux-5.13/boot/vmlinuz-5.13.0-19-generic" \
            sh scripts/test-linux-5.13.sh

      - name: Check formatting and Clippy lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run full workspace unit, OS sandbox, and black-box daemon E2E tests
        run: cargo test --workspace --locked -- --nocapture

      - name: Exercise real per-run cgroup limits in a delegated Linux service
        if: runner.os == 'Linux'
        run: |
          sudo systemd-run --quiet --wait --pipe --collect --uid="$(id -un)" \
            --working-directory="$PWD" --property=Delegate=yes \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" --setenv="RUNBAY_SANDBOX_BACKEND=$RUNBAY_SANDBOX_BACKEND" \
            sh scripts/with-delegated-cgroup.sh cargo test --workspace --locked cgroup -- --ignored --nocapture

      - name: Run runbayd self-check
        run: cargo run -p runbayd --locked -- self-check

      - name: Build release daemon & run beta-bench with HTTP daemon execution check
        run: |
          cargo build -p runbayd -p runbay-beta-bench --release --locked
          target/release/beta-bench \
            --runbayd-bin target/release/runbayd \
            --traces beta-bench/fixtures/recorded_llm_traces.json \
            --out /tmp/beta_bench_ci_results.json
          python3 -c '
          import json
          d = json.load(open("/tmp/beta_bench_ci_results.json"))
          assert d["correctness_oracle"]["all_invariants_passed"] is True, d["correctness_oracle"]
          gw_checks = d["correctness_oracle"]["6_secretless_gateway_seatbelt_e2e"]["sandbox_checks"]
          assert gw_checks["direct_internet_check_executed"] is True, gw_checks
          assert gw_checks["direct_internet_blocked"] is True, gw_checks
          assert d["daemon_http_execution"]["executed"] is True, d["daemon_http_execution"]
          assert d["daemon_http_execution"]["passed"] is True, d["daemon_http_execution"]
          '
