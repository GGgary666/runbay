[workspace]
resolver = "2"
members = [
    "crates/runbay-mvcc",
    "crates/runbay-sandbox",
    "crates/runbay-gateway",
    "crates/runbay-scheduler",
    "crates/runbayd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
bytes = "1.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
http = "1.4"
http-body-util = "0.1"
hyper = { version = "1.10", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
libc = "0.2"
parking_lot = "0.12"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
walkdir = "2.5"
